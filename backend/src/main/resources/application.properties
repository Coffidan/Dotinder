spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dotinder_db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:someVeryLongAndRandomSecretKey1234567890-Change-In-Production}
jwt.expiration=86400000

server.port=8080
# Ограничиваем origins для WebSocket/CORS только локальной разработкой
spring.websocket.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

steam.api.key=${STEAM_API_KEY:not-used}

spring.security.oauth2.client.registration.steam.provider=steam
spring.security.oauth2.client.registration.steam.client-id=${STEAM_API_KEY:not-used}
spring.security.oauth2.client.provider.steam.user-name-attribute=steamid

spring.security.oauth2.client.registration.steam.client-secret=not-used
spring.security.oauth2.client.registration.steam.scope=openid
spring.security.oauth2.client.registration.steam.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.steam.redirect-uri=http://localhost:8080/login/oauth2/code/steam

spring.security.oauth2.client.provider.steam.authorization-uri=https://steamcommunity.com/openid/login
spring.security.oauth2.client.provider.steam.token-uri=https://steamcommunity.com/openid/login
spring.security.oauth2.client.provider.steam.user-info-uri=https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v0002/
spring.security.oauth2.client.provider.steam.jwk-set-uri=https://steamcommunity.com/openid/login

logging.level.root=INFO
logging.level.com.dotinder.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.springframework.web.cors=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework.web.socket=INFO

spring.web.cors.allow-credentials=true
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

opendota.api.key=${OPENDOTA_API_KEY:}
